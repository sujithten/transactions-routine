services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transactions_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transactions_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/transactions_db?sslmode=disable
      SERVER_ADDR: ":8080"
    depends_on:
      postgres:
        condition: service_healthy

  test:
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/transactions_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: go test -tags integration -v ./tests/integration/...
    profiles:
      - test

volumes:
  postgres_data:
